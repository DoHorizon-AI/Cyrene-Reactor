name: ci

on:
  push:
    branches: [develop, main, release, chore/*, feat/*, fix/*]
  pull_request:
    branches: [develop, main, release]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-clippy-test:
    name: ci / rust-clippy-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cargo check (--locked)
        run: cargo check --locked --workspace --all-targets
      - name: Clippy check
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust unit tests
        run: cargo test --locked --workspace

  python-serving:
    name: ci / python-serving
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Enforce Plugin implementation ownership
        run: |
          test ! -d serving-runtime
          test ! -e product/src/cyrene_reactor_product/vllm_worker.py
          test ! -e product/src/cyrene_reactor_product/reference_server.py
          test ! -e runtime/core/src/cy_exec/engines/engine_factory.py
          test ! -e runtime/core/src/cy_exec/engines/vllm_async_engine.py
          test ! -e runtime/pro/src/cy_exec_pro/engines/api_engine.py
          test ! -d runtime/core/src/cy_exec/cache
          test ! -d runtime/pro/src/cy_exec_pro/engines/cache
          test ! -d components/scheduler-rs
          if grep -R -n -E --include='*.py' \
            '^(from|import) (torch|transformers|vllm|tensorrt|mindie|safetensors)(\.| |$)' \
            runtime/core/src runtime/pro/src product/src; then
            echo 'Concrete model/runtime implementations belong in Cyrene-Plugins-Official.' >&2
            exit 1
          fi
          if grep -R -n -E 'AiTraining|gateway\.cache\.v1|PromptCache|KVCacheManager' \
            runtime/core/proto runtime/core/src runtime/pro/src product/src; then
            echo 'Training and cache implementations do not belong in Reactor.' >&2
            exit 1
          fi
      - name: Lint and test Python serving seams
        run: |
          uv sync --frozen --extra dev
          uv run --frozen ruff check runtime/core/src runtime/core/tests runtime/pro/src runtime/pro/tests
          uv run --frozen python -m pytest runtime/core/tests/ runtime/pro/tests/

  publish-artifact:
    name: ci / immutable-artifact
    if: github.event_name != 'pull_request'
    needs: [rust-clippy-test, python-serving]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked packaging tool
        run: python -m pip install --disable-pip-version-check uv==0.12.3
      - name: Build immutable release bundle
        env:
          ARTIFACT_NAME: cyrene-reactor-${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="Cyrene-Reactor-${GITHUB_SHA}/" "${GITHUB_SHA}" \
            > "dist/cyrene-reactor-${GITHUB_SHA}.source.tar.gz"
          uv build --wheel --out-dir dist product
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path("dist")
          payload = []
          for path in sorted(dist.iterdir()):
              if path.name == "artifact-manifest.json":
                  continue
              payload.append(
                  {
                      "file": path.name,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "kind": "release-payload",
                  }
              )
          if not payload:
              raise SystemExit("artifact payload is empty")
          manifest = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "artifact_name": os.environ["ARTIFACT_NAME"],
              "payload": payload,
          }
          (dist / "artifact-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cyrene-reactor-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 30
