[workspace]
resolver = "2"
members = [
    "components/host-placement",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["DoHorizon AI Team"]
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
tonic = "0.11"
prost = "0.12"
prost-types = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1.0"
anyhow = "1.0"
tonic-build = "0.11"
