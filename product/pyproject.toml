[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "cyrene-reactor-product"
version = "0.1.0"
description = "Cyrene Product-owned deployment and endpoint lifecycle contract"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "uvicorn==0.52.4",
  "cyrene-artifacts @ git+https://github.com/DoHorizon-AI/Cyrene-Platform.git@c59be6f2bd82489fbe933dadff84fc589e00afd9#subdirectory=sdk/python/cyrene_artifacts",
  "cyrene-yield-contracts @ git+https://github.com/DoHorizon-AI/Cyrene-Yield.git@310c2f7fc256f3d34f490c47e63d9d553b6dfc1d#subdirectory=sdk/python/cyrene_yield_contracts",
]

[project.scripts]
cyrene-reactor = "cyrene_reactor_product.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "mypy==2.3.1",
  "openapi-spec-validator==0.9.0",
  "pytest==9.1.1",
  "ruff==0.16.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cyrene_reactor_product"]

[tool.uv]
# The pinned Yield contract snapshot still advertises an older Platform URL;
# force its transitive artifact package to the same exact Platform main object.
# Yield 契约快照仍声明旧 Platform URL；将传递依赖统一到同一精确 main 对象。
override-dependencies = [
  "cyrene-artifacts @ git+https://github.com/DoHorizon-AI/Cyrene-Platform.git@c59be6f2bd82489fbe933dadff84fc589e00afd9#subdirectory=sdk/python/cyrene_artifacts",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF002"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/cyrene_reactor_product"]
mypy_path = ["typing"]
